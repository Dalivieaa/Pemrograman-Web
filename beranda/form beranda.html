<!DOCTYPE html>
<html>
<head>
    <title>Kontak - Lombok Paradise</title>
    <link rel="stylesheet" href="form beranda.css">
</head>
<body>
    <nav>
        <a href="index.html">BERANDA</a>
        <a href="#">DESTINASI</a>
        <a href="#">EVENT</a>
    </nav>
    
    <header>
        <div class="kontak-wrapper">
            <h2>Hubungi Kami</h2>
            <p>Silahkan isi formulir dibawah ini:</p>
            
            <form class="form-pesan" onsubmit="tampilkan(event)">
                <label>Nama:</label>
                <input type="text" id="nama" required>
                <label>No Telepon:</label>
                <input type="tel" id="telepon" required>
                <label>Email:</label>
                <input type="email" id="email" required>
                <label>Tanggal Kunjungan:</label>
                <input type="date" id="tanggal" required>
                <label>Jumlah Pengunjung:</label>
                <input type="number" id="peserta" required>
                
                <label>Destinasi:</label>
                <select id="destinasi" required>
                    <option value="">-- Pilih Paket --</option>
                    <option>Pantai Kuta Mandalika</option>
                    <option>Gunung Rinjani</option>
                    <option>Gili Trawangan</option>
                    <option>Air Terjun Senaru</option>
                    <option>Desa Sade</option>
                </select>
                
                <label>Keterangan:</label>
                <textarea id="keterangan" rows="3" required></textarea>
                <button type="submit">KIRIM PESAN</button>
            </form>
            <p><strong>Alamat:</strong> Jl. Gajah Mada No. 100, Mataram</p>
        </div>
    </header>
    <script src="script tugas 2.js"></script>
</body>
</html>
